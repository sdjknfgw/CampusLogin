<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>ORB isolation test</title></head>
<body><pre id="out">running...</pre>
<script>
"use strict";
var out = [], el = document.getElementById("out");
function say(k, v){ out.push(k + ": " + v); el.textContent = out.join("\n"); }

// a) script JSONP -> :80 chkstatus
function testA(){
  return new Promise(function(res){
    var cb = "cbA" + Date.now();
    var s = document.createElement("script");
    var done = false;
    window[cb] = function(d){ done = true; say("A script-jsonp-80", "OK result=" + d.result); cleanup(); res(); };
    function cleanup(){ delete window[cb]; if(s.parentNode) s.parentNode.removeChild(s); }
    s.onerror = function(e){ say("A script-jsonp-80", "FAIL " + (done ? "" : "(no data)")); cleanup(); res(); };
    setTimeout(function(){ if(!done){ say("A script-jsonp-80", "TIMEOUT"); cleanup(); res(); } }, 6000);
    s.src = "http://172.19.0.1/drcom/chkstatus?callback=" + cb + "&v=" + Date.now() + "&lang=zh";
    document.head.appendChild(s);
  });
}

// b) fetch cors -> :80 chkstatus (portal sends ACAO:*)
function testB(){
  return fetch("http://172.19.0.1/drcom/chkstatus?callback=f&v=" + Date.now() + "&lang=zh")
    .then(function(r){ return r.text(); })
    .then(function(t){ say("B fetch-cors-80", "OK len=" + t.length + " head=" + t.slice(0, 40)); })
    .catch(function(e){ say("B fetch-cors-80", "FAIL " + e.message); });
}

// c) fetch no-cors -> :801 login with EMPTY password (fire-and-forget, can't read body, no side effect)
function testC(){
  return fetch("http://172.19.0.1:801/eportal/portal/login?callback=dr1003&login_method=1&user_account=orbtest&user_password=&wlan_user_ip=&wlan_user_ipv6=&wlan_user_mac=000000000000&wlan_ac_ip=&wlan_ac_name=&jsVersion=4.1.3&terminal_type=1&v=" + Date.now() + "&lang=zh-cn", { mode: "no-cors" })
    .then(function(){ say("C fetch-nocors-801", "PASS (request went through, opaque)"); })
    .catch(function(e){ say("C fetch-nocors-801", "FAIL " + e.message); });
}

// d) script JSONP -> :801 login with EMPTY password (safe: cannot succeed)
function testD(){
  return new Promise(function(res){
    var cb = "cbD" + Date.now();
    var s = document.createElement("script");
    var done = false;
    window[cb] = function(d){ done = true; say("D script-jsonp-801", "OK result=" + d.result + " msg=" + (d.msg||"")); cleanup(); res(); };
    function cleanup(){ delete window[cb]; if(s.parentNode) s.parentNode.removeChild(s); }
    s.onerror = function(){ say("D script-jsonp-801", "FAIL onerror"); cleanup(); res(); };
    setTimeout(function(){ if(!done){ say("D script-jsonp-801", "TIMEOUT"); cleanup(); res(); } }, 6000);
    s.src = "http://172.19.0.1:801/eportal/portal/login?callback=" + cb + "&login_method=1&user_account=orbtest&user_password=&wlan_user_ip=&wlan_user_ipv6=&wlan_user_mac=000000000000&wlan_ac_ip=&wlan_ac_name=&jsVersion=4.1.3&terminal_type=1&v=" + Date.now() + "&lang=zh-cn";
    document.head.appendChild(s);
  });
}

Promise.resolve()
  .then(testA)
  .then(testB)
  .then(testC)
  .then(testD)
  .then(function(){ out.push("ALL DONE"); el.textContent = out.join("\n"); });
</script></body></html>
