plugins {
    id 'com.android.application'
}

def releaseStorePath = System.getenv('CAMPUS_SIGN_STORE')
def releaseStorePassword = System.getenv('CAMPUS_SIGN_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('CAMPUS_SIGN_KEY_ALIAS')
def releaseKeyPassword = System.getenv('CAMPUS_SIGN_KEY_PASSWORD')

android {
    namespace 'com.campuslogin.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.campuslogin.app"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "1.0.6"
    }

    signingConfigs {
        release {
            if (releaseStorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseStorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // Local debug builds use Android's generated debug keystore unless the
            // release signing variables have explicitly been provided.
            if (releaseStorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
