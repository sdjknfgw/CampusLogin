name: Apple app validation
on:
  push:
    paths: ['CampusLogin-Apple/**', '.github/workflows/apple-build.yml']
  pull_request:
    paths: ['CampusLogin-Apple/**', '.github/workflows/apple-build.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate project resources
        run: node CampusLogin-Apple/scripts/check-project.mjs
      - name: Test protocol and build both apps
        run: bash CampusLogin-Apple/scripts/build-apple.sh
      - name: Launch iOS Simulator and macOS apps
        run: bash CampusLogin-Apple/scripts/smoke-apple.sh
      - uses: actions/upload-artifact@v5
        with:
          name: CampusLogin-Apple-development-builds
          path: CampusLogin-Apple/build/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: CampusLogin-Apple-test-evidence
          path: CampusLogin-Apple/build/evidence/
          if-no-files-found: ignore
